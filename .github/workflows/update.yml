name: Weekly Literature Update

# Monday 09:00 UTC. The generated README is not an input source.
# Strict recovery papers may auto-index; embodied leads require human review.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      render_only:
        description: "Regenerate README from existing curated/indexed data without API discovery"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: awesome-mesh-recovery-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Discover and render (or render offline)
        env:
          RENDER_ONLY: ${{ inputs.render_only }}
        run: |
          if [ "$RENDER_ONLY" = "true" ]; then
            python scripts/pipeline.py --render-only
          else
            python scripts/pipeline.py
          fi

      - name: Validate selection, deduplication and generated README
        run: python -m unittest discover -s tests -v

      - name: Commit ONLY source-of-truth output changes
        run: |
          git add -- README.md data/papers.json data/review_queue.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "auto-update: curated README and literature discovery"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
