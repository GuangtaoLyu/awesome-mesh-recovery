name: Weekly Literature Update

# Monday 09:00 UTC. The generated README is not an input source.
# Relevant preprints and embodied work auto-index without an acceptance/review gate.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      render_only:
        description: "Regenerate README from existing JSON data without API discovery"
        type: boolean
        default: false
      backfill:
        description: "Run a deeper search of the last three publication years"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: awesome-mesh-recovery-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Discover and render (or render offline)
        env:
          RENDER_ONLY: ${{ inputs.render_only }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          if [ "$RENDER_ONLY" = "true" ]; then
            python scripts/pipeline.py --render-only
          elif [ "$BACKFILL" = "true" ]; then
            python scripts/pipeline.py --backfill
          else
            python scripts/pipeline.py
          fi

      - name: Validate automatic acceptance, deduplication and compact README
        run: |
          python -m unittest discover -s tests -v
          python scripts/evaluate_selection.py --strict

      - name: Commit only changed JSON source data and generated README
        run: |
          git add -- README.md data/papers.json data/embodied.json data/pending.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "auto-update: curated README and literature discovery"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
