name: Weekly Auto Update

# Fully automatic: harvest new papers from arXiv + DBLP + Semantic Scholar +
# Crossref, deduplicate them, classify, regenerate README.md, and push.
# No human review. Runs every Monday 09:00 UTC (= 17:00 Beijing) and on manual
# dispatch. Auto-harvested papers and the hand-curated embodied section are
# combined by the README generator. The source of truth is NOT README.md.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

# Never let a new run race a still-running one against the same branch.
concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run update pipeline (harvest + dedup + curated section + README)
        run: python scripts/pipeline.py

      - name: Verify generated README and curated content
        run: python -m unittest discover -s tests -v

      # Only push when something actually changed.
      - name: Push if changed
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          if [ -z "$(git log "origin/${GITHUB_REF_NAME}..HEAD" --oneline)" ]; then
            echo "No new commits."
            exit 0
          fi
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
