name: Check Literature Pipeline

on:
  pull_request:
    paths:
      - "README.md"
      - "config.json"
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check syntax and deterministic rendering
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
